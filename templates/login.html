<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Movie Recommendation System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container auth-container">
        <header class="header">
            <nav class="top-nav">
                <a href="{{ url_for('home') }}" class="nav-back-link">&larr; Back to Movie Search</a>
            </nav>
            <h1>Welcome Back</h1>
            <p class="subtitle">Log in to your account</p>
        </header>

        <main class="main-content">
            <!-- Error Alert Message -->
            {% if message %}
                <div class="message-card error-card">
                    <h3>Login Failed</h3>
                    <p>{{ message }}</p>
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="search-form auth-form">
                <div class="input-group">
                    <label for="username" class="input-label">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="search-input" 
                        placeholder="Enter your username" 
                        value="{{ form_data.username if form_data else '' }}"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="search-input" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-recommend" id="login_btn">
                    Log In
                </button>
            </form>

            <div class="auth-footer-links">
                <p>Don't have an account? <a href="{{ url_for('register') }}" class="auth-inline-link">Register here</a></p>
            </div>
        </main>
    </div>
</body>
</html>
